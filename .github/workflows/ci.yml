# CI de NEXUS Terminal: pruebas automáticas en cada push a main y en cada pull request. No usa secretos y la app
# corre sin red (NEXUS_OFFLINE=1): solo simulación, ningún bróker ni servicio externo.
#
#   portability        LF, permisos de ejecución, mayúsculas de los imports, COPY del Dockerfile, lock de npm
#   backend            pytest completo sobre SQLite (Python 3.13, backend/requirements-dev.txt)
#   backend-postgres   la misma suite sobre PostgreSQL 16 (un esquema por prueba)
#   frontend           npm ci, chequeo de tipos, pruebas de la interfaz y compilación (Node 20)
#   docker             imagen de producción: falla cerrado, arranque en loopback, usuario sin root, sandbox,
#                      contrato de la API, parada con SIGTERM y la suite del backend dentro de la imagen
#   launcher           bash start.sh en un Linux limpio: venv, dependencias, interfaz compilada y arranque
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run still in progress (shown as "cancelled").
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  NEXUS_OFFLINE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  portability:
    name: Portabilidad Linux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: LF, permisos, mayúsculas, COPY del Dockerfile y lock de npm
        run: python3 tools/ci/portability.py

  backend:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependencias (requirements-dev.txt)
        run: python -m pip install -r requirements-dev.txt
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, so the sandbox test of the worker's empty
      # network namespace (tests/test_imp_sandbox_os_linux.py) would only be skipped with EPERM. The restriction is
      # lifted on this throw-away VM only, so the test really runs; pytest still runs as the runner user (the
      # environ tests skip under root). Kernels without that switch need nothing.
      - name: Espacios de nombres sin privilegios para la prueba de red del sandbox (solo en esta VM)
        timeout-minutes: 1
        run: |
          key=kernel.apparmor_restrict_unprivileged_userns
          if sysctl -n "$key" >/dev/null 2>&1; then
            sudo sysctl -w "$key=0" || echo "::warning::no se pudo cambiar $key: la prueba de red del sandbox se omitirá (EPERM)"
          else
            echo "$key no existe en este kernel: nada que cambiar"
          fi
          unshare --user --net true && echo "espacio de nombres de usuario y red sin privilegios: disponible" \
            || echo "::warning::este runner no permite un espacio de nombres de red sin privilegios"
      - name: Pruebas (pytest, sin red)
        timeout-minutes: 20
        run: python -m pytest -q -p no:cacheprovider -ra --durations=15 --junitxml=.tmp/junit.xml
      # The job log can only be downloaded by a signed-in user; annotations are public: each failed test (name, place
      # and pytest's explanation) shows on the run page and through the API.
      - name: Pruebas fallidas (anotaciones)
        if: failure()
        timeout-minutes: 1
        run: python ../tools/ci/pytest_failures.py .tmp/junit.xml "Backend (SQLite)"

  backend-postgres:
    name: Backend (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # localhost: app/db_pg.py connects without TLS only to loopback hosts (the service container has no TLS)
      NEXUS_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependencias (requirements-dev.txt)
        run: python -m pip install -r requirements-dev.txt
      - name: Pruebas sobre PostgreSQL (un esquema por prueba)
        timeout-minutes: 30
        run: python -m pytest -q -p no:cacheprovider -ra --durations=15 --junitxml=.tmp/junit.xml
      - name: Pruebas fallidas (anotaciones)
        if: failure()
        timeout-minutes: 1
        run: python ../tools/ci/pytest_failures.py .tmp/junit.xml "Backend (PostgreSQL 16)"

  frontend:
    name: Interfaz (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias (npm ci)
        id: install
        run: npm ci --no-audit --no-fund
      # the next three run even when one of them fails, so one run reports every problem
      - name: Chequeo de tipos
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Pruebas de la interfaz (sin red)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Compilar (vite build)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  docker:
    name: Imagen Docker (Linux)
    runs-on: ubuntu-latest
    # at least the sum of the step limits below (15 + 10 + 25): the job limit must never cut a step short, or its
    # script could not report why it stopped (both scripts keep their own limits under their step's)
    timeout-minutes: 55
    env:
      IMAGE: nexus-terminal:ci
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Construir la imagen de producción
        id: build
        timeout-minutes: 15
        run: docker build --pull --progress=plain --tag "$IMAGE" .
      - name: Prueba de humo (falla cerrado, loopback, sin root, sandbox, contrato, SIGTERM)
        timeout-minutes: 10
        run: python3 tools/ci/docker_smoke.py "$IMAGE"
      - name: Suite del backend dentro de la imagen (límites POSIX del sandbox en Linux)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}  # also after a failed smoke test
        timeout-minutes: 25
        run: python3 tools/ci/docker_tests.py "$IMAGE"

  launcher:
    name: Lanzador Linux (start.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: bash start.sh (venv, dependencias, interfaz) y /api/health
        timeout-minutes: 15
        # --timeout (s) below the step's 15 min, so the script still reports why it stopped and stops the server
        run: python tools/ci/launcher_smoke.py --port 8420 --timeout 720
